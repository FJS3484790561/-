acceptance:
  - id: A1
    source: brief.md
    text: "A1: 未登录用户看到管理员登录界面；普通用户登录后访问控制台得到明确无权限状态，不能读取或修改 Provider 配置。"
    result: passed
    reason:
      text: 未登录管理员 API 返回401并显示登录界面；普通用户显示明确403且伪造身份不能读取或修改Provider。
      truncated: false
  - id: A2
    source: brief.md
    text: "A2: 服务器内部预置管理员登录后可查看 Provider 列表与空状态，并可创建、编辑、启用和停用配置；页面状态与 HTTP API 响应一致。"
    result: passed
    reason:
      text: 公开注册管理员邮箱返回409；内部预置后管理员可完成空态、列表、创建、编辑、启停。
      truncated: false
  - id: A3
    source: brief.md
    text: "A3: Provider 表单验证名称、端点、模型和密钥要求；保存中、成功、验证失败、冲突和服务错误状态明确且可恢复。"
    result: passed
    reason:
      text: 表单验证名称、HTTP(S)端点、模型和密钥；覆盖保存、重复冲突、服务错误、清空密钥和恢复路径。
      truncated: false
  - id: A4
    source: brief.md
    text: "A4: 所有列表、详情、表单和审计响应只展示 `apiKeyConfigured` 与掩码，不展示、记录或回填密钥明文。"
    result: passed
    reason:
      text: 公开配置仅展示配置状态与掩码，页面、审计、编辑表单及构建产物不显示或回填密钥。
      truncated: false
  - id: A5
    source: brief.md
    text: "A5: 管理员可查看单个 Provider 的脱敏审计记录；请求体中的 sessionToken/providerId 不能覆盖 Cookie
      或路径身份。"
    result: passed
    reason:
      text: 脱敏审计可读取；请求体 sessionToken/providerId 不能覆盖 Cookie 或 URL 路径身份。
      truncated: false
  - id: A6
    source: brief.md
    text: "A6: 管理员页面在桌面和 320-390px 移动视口无横向溢出、文字裁切或主要控件重叠；焦点可见，表单和图标按钮具有可理解名称。"
    result: passed
    reason:
      text: 1366px、390px、320px无横向溢出、裁切或主要控件重叠；输入与按钮有名称、焦点可见，reduced-motion生效。
      truncated: false
  - id: A7
    source: brief.md
    text: "A7: 管理员端自动化测试、lint、build、typecheck/语法检查通过，并提供权限、脱敏及桌面/移动浏览器验证证据。"
    result: passed
    reason:
      text: 独立复跑35/35测试、lint、构建/语法和浏览器QA通过，权限、脱敏与三视口均有动态证据。
      truncated: false
