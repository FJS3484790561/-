        credit_operations，测试未覆盖重复迁移和带额度流水的恢复。
      truncated: false
  - id: A5
    source: brief.md
    text: "A5: 未配置生产数据库或对象存储时采用明确的非生产配置；生产模式缺少必要配置必须拒绝启动，不得静默退回内存存储。"
    result: passed
