acceptance:
  - id: A1
    source: brief.md
    text: "A1: 未登录用户看到认证界面；可注册、登录、退出、请求密码找回，错误信息安全且登录后会话可恢复。"
    result: passed
    reason:
      text: 认证界面、注册、登录、退出、密码找回与重置流程均接入本地 HTTP API；安全错误文案、HttpOnly Cookie
        会话恢复及退出清除会话均有实现和测试覆盖。
      truncated: false
  - id: A2
    source: brief.md
    text: "A2: 已登录用户可上传有效图片、选择空间/风格/强度/偏好并通过 HTTP API 创建生成任务；加载、失败、额度不足和成功状态均可见且可恢复。"
    result: passed
    reason:
      text: 有效图片校验、空间/风格/强度/偏好参数、生成任务创建与轮询均通过 HTTP API
        实现；加载、失败、额度不足和成功状态明确，失败释放额度及成功扣减已有测试覆盖。
      truncated: false
  - id: A3
    source: brief.md
    text: "A3: 成功结果同时展示原图与效果图，前后对比滑块可通过指针和键盘操作，标签清晰且下载/保存动作状态正确。"
    result: passed
    reason:
      text: 成功结果展示原图和效果图；对比滑块具有准确名称并支持指针与键盘操作，保存、已保存和下载状态实现完整，浏览器 QA 验证键盘移动。
      truncated: false
  - id: A4
    source: brief.md
    text: "A4: 我的作品支持空状态、列表、查看单项和保存生成结果；任何用户都不能通过界面读取其他用户作品。"
    result: passed
    reason:
      text: 作品空状态、保存、列表、详情和下载均已实现；服务层按 HttpOnly Cookie 会话确定用户，跨用户读取作品返回 404，并有自动化测试覆盖。
      truncated: false
  - id: A5
    source: brief.md
    text: "A5: 额度页展示当前余额、有效期说明和已确认充值方案；创建订单后只显示待支付状态，不虚构支付成功或提前增加额度。"
    result: passed
    reason:
      text: 额度余额、12个月有效期说明、1-9元自定义方案及10元12次、30元45次、100元200次方案均准确展示；订单仅显示待支付，测试确认创建订单不会提前增加额度。
      truncated: false
  - id: A6
    source: brief.md
    text: "A6: 关键用户页面在桌面和 320-390px 移动视口无横向溢出、文字裁切或主要控件重叠，焦点可见、表单有名称、主要目标至少 44px。"
    result: passed
    reason:
      text: 隐藏文件 input 现以 aria-label="上传房间照片" 提供准确可访问名称，构建产物包含该名称；浏览器 QA 使用
        getByLabel("上传房间照片")
        实际定位并上传文件。桌面、390px和320px流程通过，无横向溢出或意外控制台错误；焦点、44px目标和响应式规则仍保持。
      truncated: false
  - id: A7
    source: brief.md
    text: "A7: 浏览器请求统一使用本地 HTTP API 和 HttpOnly 会话
      Cookie；前端源码、错误信息和构建产物不包含会话令牌、测试密钥或敏感配置明文。"
    result: passed
    reason:
      text: 前端统一请求同源 /api 并使用 credentials="include"；服务端会话 Cookie 为
        HttpOnly、SameSite=Lax，客户端不保存或发送
        sessionToken。源码和构建产物检查未发现会话令牌、测试密钥或浏览器存储用法。
      truncated: false
  - id: A8
    source: brief.md
    text: "A8: 用户端自动化测试、lint、build、typecheck/语法检查通过，并提供桌面与移动浏览器验证证据。"
    result: passed
    reason:
      text: Runtime 已统一执行并通过 npm test（35/35）、lint、build、typecheck/语法检查和
        qa:browser；浏览器证据覆盖桌面、390px、320px及认证、生成、对比、作品、订单和退出流程。
      truncated: false
