acceptance:
  - id: A1
    source: brief.md
    text: "A1: 核心用户流程可从认证进入工作台，完成参数选择、生成模拟、前后对比，并访问作品和额度入口；不存在阻断性页面错误。"
    result: passed
    reason:
      text: 用户端 Playwright 在桌面 1440x1000、移动端 390x844 和最小移动端 320x800
        完成找回密码入口、注册、进入工作台、上传图片、通过 HTTP API
        生成模拟、前后对比、保存作品、作品详情、额度订单、账户帮助和退出登录；三个视口均无意外控制台错误或阻断性页面错误。
      truncated: false
  - id: A2
    source: brief.md
    text: "A2: 生成结果的前后对比控件可通过指针和键盘操作，左右两侧标签清晰且不会互相遮挡。"
    result: passed
    reason:
      text: 实际实现使用覆盖对比区域的原生 range 控件，并提供“调整原图和效果图的分界位置”标签；browser-qa 与 browser-qa-long
        均在三个视口通过 ArrowRight 验证键盘移动，同时确认“生成之前”和“生成之后”标签不重叠。
      truncated: false
  - id: A3
    source: brief.md
    text: "A3: 关键页面在桌面和移动视口下无横向溢出、文字裁切或主要控件重叠。"
    result: passed
    reason:
      text: 用户端在 1440x1000、390x844、320x800，管理员端在 1366x900、390x844、320x800
        均完成关键流程；Runtime 浏览器记录显示各视口无横向溢出、对比标签不重叠、主要控件可操作，未发现阻断性文字裁切或控件重叠。
      truncated: false
  - id: A4
    source: brief.md
    text: "A4: 交互控件具有可见焦点，关键表单与按钮具备可理解的名称，页面不存在自动化可访问性检查发现的严重问题。"
    result: passed
    reason:
      text: 关键表单、按钮和滑杆均可通过语义角色或标签定位；全局样式为 button、input、select、链接等交互控件提供 focus-visible
        轮廓，管理员端三个视口实测焦点可见，对比滑杆键盘操作通过，现有基础自动化可访问性检查未发现严重问题。
      truncated: false
  - id: A5
    source: brief.md
    text: "A5: 未登录、普通用户和管理员边界符合现有服务约束；错误信息、公开响应和前端构建产物不包含测试密钥或敏感配置明文。"
    result: passed
    reason:
      text: 37项测试确认匿名管理员请求返回401、普通用户返回403、用户任务/作品/订单按所有者隔离，会话使用 HttpOnly、SameSite=Lax
        Cookie，服务异常仅返回安全错误码；Provider
        密钥加密保存且在响应、页面和审计记录中遮蔽。对源码及前端构建产物的常见生产密钥和私钥模式扫描未发现匹配。
      truncated: false
  - id: A6
    source: brief.md
    text: "A6: 自动化测试、lint、build 和 typecheck/语法检查全部通过，失败项必须记录原因而不能静默忽略。"
    result: passed
    reason:
      text: Runtime stateVersion 11 的六项检查均为 passed：browser-qa 退出码0、耗时24133ms；npm test
        37/37通过；lint通过；build通过；typecheck脚本通过并明确声明JavaScript项目由Vite构建承担语法和模块检查；browser-qa-long退出码0、耗时19281ms。补充长时限检查已消除上一
        attempt 的超时歧义。
      truncated: false
  - id: A7
    source: brief.md
    text: "A7: 上线准备报告明确区分已就绪能力和未完成的生产数据库、服务器、域名、真实支付、真实 Provider、邮件服务及密钥管理工作。"
    result: passed
    reason:
      text: "READINESS_REPORT 明确标记 READINESS_STATUS: NOT_READY_FOR_RELEASE 和
        RELEASE_APPROVED:
        NO，并分别列明本地已验证能力及尚未完成的生产数据库、真实支付、图像Provider、邮件服务、密钥管理、服务器、域名、HTTPS、监控和回滚\
        工作。"
      truncated: false
  - id: A8
    source: brief.md
    text: "A8: 本 Change 不执行部署、远程推送、域名配置、真实支付交易或生产凭据写入。"
    result: passed
    reason:
      text: 候选差异只包含本地用户端、管理员端、HTTP API、测试和准备度文档；仓库未配置 Git
        remote，未发现部署或域名基础设施配置，也没有生产凭据写入证据。本 Change 未执行远程推送、部署、域名配置或真实支付交易。
      truncated: false
