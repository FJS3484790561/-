acceptance:
  - id: A1
    source: brief.md
    text: "A1: 用户提交合法邮箱和密码后，可以创建账号；重复邮箱被拒绝并显示可理解错误。"
    result: passed
    reason:
      text: AuthService 对邮箱进行规范化和格式校验，使用 scrypt 哈希保存密码，重复邮箱返回
        EMAIL_ALREADY_REGISTERED；Runtime 测试通过。
      truncated: false
  - id: A2
    source: brief.md
    text: "A2: 已注册用户可以登录和退出；错误密码不会建立会话。"
    result: passed
    reason:
      text: 正确密码建立会话，错误密码和未知邮箱均返回 INVALID_CREDENTIALS，logout 删除会话摘要；Runtime 测试通过。
      truncated: false
  - id: A3
    source: brief.md
    text: "A3: 用户请求密码重置后，系统不会泄露邮箱是否存在，并对有效请求生成一次性、限时重置流程。"
    result: passed
    reason:
      text: 未知邮箱与有效邮箱请求均返回 {ok:true}，有效邮箱生成限时重置流程；重置令牌仅以 SHA-256 摘要保存。
      truncated: false
  - id: A4
    source: brief.md
    text: "A4: 有效重置链接只能使用一次；过期或已使用链接不能修改密码。"
    result: passed
    reason:
      text: 重置成功后删除令牌摘要，重复使用和超过 30 分钟后均拒绝；Runtime 测试通过。
      truncated: false
  - id: A5
    source: brief.md
    text: "A5: 登录会话在刷新后可以恢复，退出后旧会话不能继续访问受保护资源。"
    result: passed
    reason:
      text: 会话以令牌摘要索引，可通过 getSession 恢复身份；logout 后旧令牌返回 null；Runtime 测试通过。
      truncated: false
  - id: A6
    source: brief.md
    text: "A6: 未登录用户访问受保护用户资源时得到未授权结果；用户只能以自己的身份访问后续资源边界。"
    result: passed
    reason:
      text: 无效或已退出会话返回 null，活动会话绑定 userId 并仅返回对应用户摘要；当前 Change 未包含资源端点。
      truncated: false
