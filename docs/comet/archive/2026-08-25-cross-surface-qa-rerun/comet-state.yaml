acceptance:
  - id: A1
    source: brief.md
    text: "A1: 核心用户流程可从认证进入工作台，完成参数选择、生成模拟、前后对比，并访问作品和额度入口；不存在阻断性页面错误。"
    result: passed
    reason:
      text: 用户端 Playwright 在 desktop、390px、320px
        完成找回入口、注册、进入工作台、上传、生成模拟、前后对比、保存作品、作品详情、额度订单、账户帮助及退出；三个视口均无意外控制台错误。源码确认设计参数会随生成请求提交。
      truncated: false
  - id: A2
    source: brief.md
    text: "A2: 生成结果的前后对比控件可通过指针和键盘操作，左右两侧标签清晰且不会互相遮挡。"
    result: passed
    reason:
      text: 对比区使用覆盖完整画面的原生 range 控件，支持指针操作；QA 通过 ArrowRight
        验证键盘改变分界值，并在三个视口用边界框断言标签不重叠。
      truncated: false
  - id: A3
    source: brief.md
    text: "A3: 关键页面在桌面和移动视口下无横向溢出、文字裁切或主要控件重叠。"
    result: passed
    reason:
      text: 用户端 1440x1000、390x844、320x800，以及管理员端 1366x900、390x844、320x800
        均验证无横向溢出；关键流程在各视口成功完成，未见主要控件重叠或关键文字裁切证据。
      truncated: false
  - id: A4
    source: brief.md
    text: "A4: 交互控件具有可见焦点，关键表单与按钮具备可理解的名称，页面不存在自动化可访问性检查发现的严重问题。"
    result: passed
    reason:
      text: 浏览器测试通过语义角色或标签定位关键表单、按钮和滑杆；全局 CSS 提供 focus-visible
        轮廓，管理员三个视口实测焦点可见，滑杆键盘操作通过，未记录严重可访问性错误。
      truncated: false
  - id: A5
    source: brief.md
    text: "A5: 未登录、普通用户和管理员边界符合现有服务约束；错误信息、公开响应和前端构建产物不包含测试密钥或敏感配置明文。"
    result: passed
    reason:
      text: HTTP 测试确认匿名管理员请求为 401、普通用户为 403，用户资源按所有者隔离；会话使用 HttpOnly/SameSite
        Cookie，异常仅返回安全错误码，Provider 密钥在响应和审计中脱敏。独立扫描未发现被跟踪 .env、私钥、常见生产 API key
        或构建产物敏感匹配。
      truncated: false
  - id: A6
    source: brief.md
    text: "A6: 自动化测试、lint、build 和 typecheck/语法检查全部通过，失败项必须记录原因而不能静默忽略。"
    result: passed
    reason:
      text: Runtime 记录 npm test 37/37、lint、Vite build、typecheck/语法边界检查、组合浏览器 QA
        和生产依赖审计全部成功；qa:browser 使用 && 串联且断言失败会产生非零退出码。
      truncated: false
  - id: A7
    source: brief.md
    text: "A7: 上线准备报告明确区分已就绪能力和未完成的生产数据库、服务器、域名、真实支付、真实 Provider、邮件服务及密钥管理工作。"
    result: passed
    reason:
      text: "READINESS_REPORT 标记 NOT_READY_FOR_RELEASE 和 RELEASE_APPROVED:
        NO，分别列出已验证本地能力以及生产数据库、服务器域名、真实支付、Provider、邮件、密钥管理和安全控制缺口。"
      truncated: false
  - id: A8
    source: brief.md
    text: "A8: 本 Change 不执行部署、远程推送、域名配置、真实支付交易或生产凭据写入。"
    result: passed
    reason:
      text: Change brief、Spec 和报告均限定为本地 QA；仓库没有配置 Git
        remote，工作区未发现部署、域名配置、真实交易或生产凭据写入证据。
      truncated: false
  - id: A9
    source: specs/release-readiness/spec.md
    text: The local paid-MVP baseline provides user authentication and password
      recovery, the design workbench, simulated generation with a
      keyboard-operable before/after comparison, works and credit/order entry
      points, and an administrator surface at `/admin`. Browser flows use the
      existing HTTP API boundary and preserve server-side authentication,
      credit, order, and administrator authorization rules.
    result: passed
    reason:
      text: 源码和组合浏览器 QA 覆盖邮箱认证与找回、设计工作台、模拟生成、键盘前后对比、作品、额度订单及 /admin；前端统一调用 /api 并使用
        Cookie，服务端执行会话、额度、订单、作品和管理员规则。
      truncated: false
  - id: A10
    source: specs/release-readiness/spec.md
    text: The user and administrator surfaces remain usable at desktop, 390px, and
      320px widths without horizontal overflow, clipped essential text, or
      overlapping primary controls. Interactive controls expose understandable
      names and visible focus. The before/after control supports pointer and
      keyboard input and keeps both comparison labels readable.
    result: passed
    reason:
      text: 用户端和管理员端均在 desktop、390px、320px
        完成浏览器流程且无横向溢出；关键控件有语义名称，焦点样式存在，对比滑杆键盘移动和标签不重叠断言全部通过。
      truncated: false
  - id: A11
    source: specs/release-readiness/spec.md
    text: Anonymous, normal-user, and administrator capabilities remain separated
      according to the existing service contracts. Public responses,
      user-visible errors, source files, logs, screenshots, and frontend build
      output do not expose test secrets, merchant credentials, Provider keys, or
      production configuration.
    result: passed
    reason:
      text: 测试覆盖匿名、普通用户、管理员及跨用户资源隔离；公开响应、异常和 Provider 审计不返回令牌、密钥或内部堆栈。独立检查源码、Runtime
        日志和 dist 未发现生产敏感模式或构建产物测试凭据匹配。
      truncated: false
  - id: A12
    source: specs/release-readiness/spec.md
    text: Automated tests, lint, build, JavaScript syntax/module checking, combined
      browser QA, permission checks, and sensitive-data checks are recorded
      without suppressing failures. The readiness report distinguishes locally
      implemented and verified capabilities from outstanding production
      database, hosting, domain, real payment, real Provider, email delivery,
      and secret-management work.
    result: passed
    reason:
      text: Runtime 保留单测、lint、build、typecheck、浏览器 QA
        和生产依赖审计日志；浏览器日志记录布局、键盘对比、标签、权限、焦点和密钥显示结果，准备报告区分本地通过项与生产缺口。
      truncated: false
  - id: A13
    source: specs/release-readiness/spec.md
    text: This capability produces QA evidence and a readiness assessment only. It
      does not deploy, push remotely, configure a domain, execute a real
      payment, write production credentials, or grant release approval.
    result: passed
    reason:
      text: "候选仅新增 QA 断言、Change 文档和 readiness 报告更新；报告保持 RELEASE_APPROVED: NO，Git
        状态和历史未显示部署、远程推送、域名配置、真实支付、生产凭据或发布批准活动。"
      truncated: false
