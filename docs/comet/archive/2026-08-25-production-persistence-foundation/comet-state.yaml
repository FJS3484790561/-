acceptance:
  - id: A1
    source: brief.md
    text: "A1: 创建账户、会话、Provider 配置、额度、订单和作品后重启应用，数据仍可读取且关联关系保持一致。"
    result: passed
    reason:
      text: 持久化集成测试真实关闭并重新打开 SQLite，随后成功读取账户、会话、额度、已支付订单、生成任务、作品及 Provider
        配置；表间用户归属由外键维持。
      truncated: false
  - id: A2
    source: brief.md
    text: "A2: 额度增加、成功生成扣减和支付到账使用事务及唯一约束，失败或重复操作不会造成部分写入、负余额或重复到账。"
    result: passed
    reason:
      text: 额度发放、预留、结算及支付回调均运行在 BEGIN IMMEDIATE
        事务边界内，并通过唯一幂等键和不可变流水防止重复到账；初始任务写入、生成结算及 Provider
        审计失败均有回滚测试，额度分配不会超额或形成负余额。
      truncated: false
  - id: A3
    source: brief.md
    text: "A3: 图片内容通过对象存储接口写入和读取，数据库只保存对象键、类型、大小和归属等元数据；本地测试不需要生产凭据。"
    result: passed
    reason:
      text: 原图及 Provider 结果均先取得并校验实际图片字节，再写入对象存储；SQLite
        仅保存对象键、类型、大小、归属和元数据。受保护读取验证了用户归属，本地适配器无需生产凭据，COS 适配边界由隔离客户端覆盖。
      truncated: false
  - id: A4
    source: brief.md
    text: "A4: 数据库迁移可从空库重复执行到最新版本；备份可恢复到隔离位置，完整性检查能核对关键表、外键和额度流水一致性。"
    result: passed
    reason:
      text: 迁移支持空库到最新版本及重复执行；新增夹具先创建仅应用 v1 migration 的真实 SQLite
        数据库，写入存量额度批次、已结算预留和旧操作，关闭后升级到 v2，并验证 grant/reserve/settle
        流水回填、旧操作表保留及完整性检查通过。备份测试验证了隔离重开、关键表、外键和额度流水一致性。
      truncated: false
  - id: A5
    source: brief.md
    text: "A5: 未配置生产数据库或对象存储时采用明确的非生产配置；生产模式缺少必要配置必须拒绝启动，不得静默退回内存存储。"
    result: passed
    reason:
      text: 开发模式明确支持内存或本地对象存储；生产模式缺少数据库路径、稳定加密密钥或完整 COS 配置时拒绝启动，不会静默回退到内存存储。
      truncated: false
  - id: A6
    source: brief.md
    text: "A6: 现有自动化测试保持通过，并新增重启持久化、事务回滚、并发幂等、迁移、对象存储和备份恢复测试。"
    result: passed
    reason:
      text: Runtime 已通过 51 项测试、lint、build 和 production audit。并发测试使用两个独立 Worker，各自创建独立
        SQLite 连接；holder 先执行 BEGIN IMMEDIATE 并通过 Atomics 屏障保持写锁，contender
        随后开始同一幂等发放，主线程延迟释放锁。测试观测 contender 至少等待
        75ms，并验证两次结果指向同一额度批次、对应流水仅一条；这修复了 iteration 2
        的伪并发问题。重启、事务回滚、迁移、对象存储及备份恢复测试均已覆盖。
      truncated: false
