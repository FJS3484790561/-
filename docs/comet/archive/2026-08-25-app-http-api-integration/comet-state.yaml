acceptance:
  - id: A1
    source: brief.md
    text: "A1: 本地 HTTP Server 可启动、响应 `/api/health`，并对未知路由返回安全的 JSON `NOT_FOUND`。"
    result: passed
    reason:
      text: 真实临时 HTTP Server 验证通过：GET /api/health 返回 200 ready；无请求体和 Content-Type 的
        POST /api/missing 返回 404 及 JSON NOT_FOUND。
      truncated: false
  - id: A2
    source: brief.md
    text: "A2: 注册、登录、会话查询、退出和密码找回路由调用现有 AuthService；登录成功设置 HttpOnly、SameSite
      Cookie，未认证请求返回 `UNAUTHORIZED`。"
    result: passed
    reason:
      text: 注册、登录、会话、退出和密码找回路由均连接 AuthService；未认证会话返回 401。生产模式登录 Cookie 实测包含
        HttpOnly、SameSite=Lax、Secure，登录响应不含 sessionToken，密码重置响应不回显重置令牌。
      truncated: false
  - id: A3
    source: brief.md
    text: "A3: 已认证用户可通过 HTTP 创建和查询生成任务；图片和参数进入现有 GenerationService，任务所有权隔离保持有效。"
    result: passed
    reason:
      text: 真实 HTTP 请求成功创建和查询生成任务；10 MiB PNG 进入 GenerationService 并返回 202。请求体伪造
        sessionToken 无法覆盖 Cookie 身份，其他用户读取任务返回 404。
      truncated: false
  - id: A4
    source: brief.md
    text: "A4: 已认证用户可查询额度、创建/查询订单、创建/列表/读取作品；其他用户不能读取其订单或作品。"
    result: passed
    reason:
      text: 额度、订单和作品路由连接现有服务。请求体 sessionToken 无法覆盖 Cookie 身份，其他用户读取作品和订单均返回 404。
      truncated: false
  - id: A5
    source: brief.md
    text: "A5: 管理员 Provider 路由调用现有 AdminProviderService；普通用户和未登录用户不能读取或修改 Provider
      配置，公开响应不包含密钥明文。"
    result: passed
    reason:
      text: 公开注册大小写变体 ADMIN@example.com 实测返回 409，未创建用户且不能登录；内部 provisionAdmin
        后管理员可登录并创建 Provider。未登录和普通用户分别返回 401、403；请求体 sessionToken 和 providerId
        无法覆盖 Cookie 或路径身份；Provider及审计响应均不含密钥明文。
      truncated: false
  - id: A6
    source: brief.md
    text: "A6: API 统一限制 JSON 请求大小、校验 Content-Type、返回安全错误，不向响应或日志暴露会话令牌、密码、Provider
      密钥、支付签名或内部异常。"
    result: passed
    reason:
      text: application/json-evil 实测返回 415且未创建用户；未知路由不受请求体校验干扰。默认上限为16777216字节，完整10
        MiB图片的Base64
        JSON实测为13981249字节并成功返回202。响应未暴露会话令牌、密码、Provider密钥、支付签名或内部异常。
      truncated: false
  - id: A7
    source: brief.md
    text: "A7: 自动化测试覆盖健康检查、认证
      Cookie、用户隔离、生成、作品、额度、订单、管理员权限、请求限制和错误脱敏；test、lint、build、typecheck 全部通过。"
    result: passed
    reason:
      text: 独立复跑 npm
        test，33/33通过；新增测试覆盖未知POST路由、管理员邮箱抢注、无效JSON媒体类型和请求大小边界。Runtime提供的npm run
        lint、npm run build、npm run
        typecheck结果均通过；验收要求覆盖的Cookie、隔离、身份覆盖和脱敏边界已额外通过真实HTTP探测。
      truncated: false
